[workspace]
members = [
    "crates/nexa_span",
    "crates/nexa_source",
    "crates/nexa_diagnostics",
    "crates/nexa_syntax",
    "crates/nexa_parser",
    "crates/nexa_hir",
    "crates/nexa_mir",
    "crates/nexa_compiler",
    "crates/nexac",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
publish = false
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/baicie/nexa"
homepage = "https://github.com/baicie/nexa"
documentation = "https://docs.rs/nexa"
authors = ["bai cie <zl316546@gmail.com>"]
readme = "README.md"
keywords = ["compiler", "language", "rust", "workspace"]
categories = ["compilers", "command-line-utilities"]

[workspace.dependencies]
nexa_span = { path = "crates/nexa_span", version = "0.0.1" }
nexa_source = { path = "crates/nexa_source", version = "0.0.1" }
nexa_diagnostics = { path = "crates/nexa_diagnostics", version = "0.0.1" }
nexa_syntax = { path = "crates/nexa_syntax", version = "0.0.1" }
nexa_parser = { path = "crates/nexa_parser", version = "0.0.1" }
nexa_hir = { path = "crates/nexa_hir", version = "0.0.1" }
nexa_mir = { path = "crates/nexa_mir", version = "0.0.1" }
nexa_compiler = { path = "crates/nexa_compiler", version = "0.0.1" }

anyhow = "1"
thiserror = "2"
# Keep the resolved CLI stack compatible with the workspace MSRV (Rust 1.80).
clap = { version = "=4.5.32", features = ["derive"] }
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
large_enum_variant = "warn"
manual_ok_or = "warn"
