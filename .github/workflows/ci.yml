name: CI

on:
  pull_request:
  push:
    branches: [mvp]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  msrv:
    name: MSRV / Rust 1.80
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.80
        uses: dtolnay/rust-toolchain@1.80.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Check parser fuzz target
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

      - name: Validate Stage 0 bootstrap contract
        run: cargo run --locked --package xtask -- bootstrap-contract

  parser-fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run bounded parser fuzz smoke
        run: cargo fuzz run parser -- -runs=256

      - name: Upload parser crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-fuzz-artifacts
          path: fuzz/artifacts/parser
          if-no-files-found: ignore

  ci:
    name: CI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Conformance
        run: cargo run --locked --package xtask -- conformance

      - name: Docs
        run: cargo doc --locked --workspace --all-features --no-deps
