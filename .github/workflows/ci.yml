name: CI

on:
  pull_request:
  push:
    branches: [mvp]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  msrv:
    name: MSRV / Rust 1.80
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.80
        uses: dtolnay/rust-toolchain@1.80.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Check front-end fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

      - name: Validate Stage 0 bootstrap contract
        run: cargo run --locked --package xtask -- bootstrap-contract

      - name: Validate Bootstrap Profile v1
        run: cargo run --locked --package xtask -- bootstrap-profile

      - name: Validate Futao lexer differential
        run: cargo run --locked --package xtask -- lexer-differential

      - name: Validate Futao parser differential
        run: cargo run --locked --package xtask -- parser-differential

      - name: Validate Futao resolver differential
        run: cargo run --locked --package xtask -- resolver-differential

      - name: Validate Futao type-checker differential
        run: cargo run --locked --package xtask -- typecheck-differential

      - name: Upload parser differential mismatch artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-differential-mismatch
          path: target/parser-differential
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload resolver differential mismatch artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resolver-differential-mismatch
          path: target/resolver-differential
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload type-checker differential mismatch artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-differential-mismatch
          path: target/typecheck-differential
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate private NIR artifacts
        run: cargo run --locked --package xtask -- nir-artifact

  front-end-fuzz:
    name: ${{ matrix.target }} fuzz smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parser, lexer, resolver]

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run bounded front-end fuzz smoke
        run: cargo fuzz run ${{ matrix.target }} -- -runs=256

      - name: Upload front-end crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-fuzz-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  storage-miri:
    name: Storage kernel / Miri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust and Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run storage kernel under Miri
        run: cargo miri test --locked -p nexa_storage --tests

  ci:
    name: CI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Validate release script
        run: bash -n scripts/release.sh

      - name: Check
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Conformance
        run: cargo run --locked --package xtask -- conformance

      - name: Docs
        run: cargo doc --locked --workspace --all-features --no-deps
